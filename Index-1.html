<style>
/* Identity: forest green + gold taken from the Peace and Security Cluster seal; Oswald headings echo the seal lettering. Diagonal gold stripes echo the handshake. */
:root{
  --bg:#eff3ec; --surface:#fff; --surface-2:#f5f8f2; --fg:#0f2012; --muted:#566655; --line:#d6ddd0;
  --green:#043400; --green-2:#0d5a14; --green-3:#1f7a2a; --gold:#fdb515; --gold-2:#b87800; --gold-bg:#fff2cc;
  --nav:#043400; --nav-fg:#d3e3cd; --nav-head:#8fb08a; --nav-active:rgba(253,181,21,.16);
  --accent:#0d5a14; --accent-fg:#fff;
  --ok:#17722a; --ok-bg:#dcf1e0; --warn:#85570a; --warn-bg:#fff0c4; --bad:#a3262f; --bad-bg:#fbe1e3; --info:#2a5d8f; --info-bg:#e0ebf6;
  --in-c:#1f7a2a; --out-c:#d99100; --on-gold:#2a1d00;
  --font-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07150a; --surface:#0f2212; --surface-2:#14291a; --fg:#e8f2e5; --muted:#9bb297; --line:#234027;
  --gold-2:#fdb515; --gold-bg:#3a2d06; --nav:#031f00; --nav-fg:#b9d0b3; --nav-head:#6f8f6a;
  --accent:#fdb515; --accent-fg:#241800;
  --ok:#6fd18a; --ok-bg:#12391c; --warn:#f2c14e; --warn-bg:#3a2d06; --bad:#ff8b93; --bad-bg:#4a1b20; --info:#8fb9e6; --info-bg:#173250;
  --in-c:#6fd18a; --out-c:#fdb515; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07150a; --surface:#0f2212; --surface-2:#14291a; --fg:#e8f2e5; --muted:#9bb297; --line:#234027;
  --gold-2:#fdb515; --gold-bg:#3a2d06; --nav:#031f00; --nav-fg:#b9d0b3; --nav-head:#6f8f6a;
  --accent:#fdb515; --accent-fg:#241800;
  --ok:#6fd18a; --ok-bg:#12391c; --warn:#f2c14e; --warn-bg:#3a2d06; --bad:#ff8b93; --bad-bg:#4a1b20; --info:#8fb9e6; --info-bg:#173250;
  --in-c:#6fd18a; --out-c:#fdb515; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--green-3)}
:root[data-theme="dark"] a{color:var(--gold)}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,var(--nav),#021500);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:3px solid var(--gold)}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 2px;text-align:center}
.brand img{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.45)}
.brand b{display:block;color:#fff;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.brand span{font-size:11.5px;color:var(--gold)}
nav{display:flex;flex-direction:column;gap:2px}
nav h4{margin:12px 10px 4px;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-head);font-weight:500}
nav button{background:none;border:0;border-left:3px solid transparent;text-align:left;padding:8px 10px;border-radius:0 6px 6px 0;color:inherit;cursor:pointer;display:flex;gap:10px;align-items:center}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-current="page"]{background:var(--nav-active);color:#fff;border-left-color:var(--gold);font-weight:500}
nav svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot .btn{background:rgba(255,255,255,.08);color:var(--nav-fg);border-color:rgba(255,255,255,.2)}
.side-foot .btn:hover{background:rgba(255,255,255,.16);color:#fff}
.side-foot svg{width:16px;height:16px;flex:none}
main{padding:20px clamp(16px,3vw,32px) 32px;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;padding-bottom:12px;border-bottom:3px solid var(--gold)}
.top h1{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
:root[data-theme="dark"] .top h1{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top h1{color:var(--fg)}}
.top small{color:var(--muted)}
.who{text-align:right;font-size:12.5px;color:var(--muted)}
.who b{color:var(--fg);display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel h3,.charts h3{font-family:var(--font-display);font-size:14px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;margin-bottom:12px;color:var(--green-2)}
:root[data-theme="dark"] .panel h3{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel h3{color:var(--gold)}}
.grid{display:grid;gap:14px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold-2)}
textarea{min-height:84px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--gold-2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.ok{background:var(--green-2);color:#fff;border-color:var(--green-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 150px}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;font-family:var(--font-display);font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--green-2)}
:root[data-theme="dark"] .sec{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec{color:var(--gold)}}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.dirbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:8px;margin-bottom:16px;color:#fff;background:linear-gradient(100deg,var(--green) 0%,var(--green-2) 100%);position:relative;overflow:hidden}
.dirbar.out{background:linear-gradient(100deg,#6a4700 0%,#c98a00 100%)}
.dirbar::after{content:"";position:absolute;right:-20px;top:0;bottom:0;width:180px;background:repeating-linear-gradient(135deg,rgba(253,181,21,.9) 0 8px,transparent 8px 20px);opacity:.35}
.dirbar.out::after{background:repeating-linear-gradient(135deg,rgba(255,255,255,.9) 0 8px,transparent 8px 20px);opacity:.25}
.dirbar b{font-family:var(--font-display);font-size:18px;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.dirbar span{opacity:.9;font-size:12.5px}
.dirbar svg{width:30px;height:30px;color:var(--gold);flex:none}
.dirbar.out svg{color:#fff}
/* Dashboard */
.hero{position:relative;overflow:hidden;border-radius:14px;padding:22px 26px;color:#fff;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:radial-gradient(120% 160% at 0% 0%,#0c5a14 0%,var(--green) 55%,#021a00 100%);box-shadow:0 6px 22px rgba(4,52,0,.28);margin-bottom:16px}
.hero::before{content:"";position:absolute;right:-60px;top:-40px;bottom:-40px;width:46%;background:repeating-linear-gradient(135deg,var(--gold) 0 14px,transparent 14px 38px);opacity:.22;transform:skewX(-8deg)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold),#ffd25c,var(--gold))}
.hero img{width:112px;height:112px;position:relative;z-index:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--gold),0 6px 16px rgba(0,0,0,.5)}
.hero .t{position:relative;z-index:1;min-width:0;flex:1 1 260px}
.hero .t small{display:block;font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:13px}
.hero .t h2{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,40px);letter-spacing:.04em;text-transform:uppercase;line-height:1.05;margin:2px 0 6px}
.hero .t p{margin:0;opacity:.9;font-size:13px}
.hero .d{position:relative;z-index:1;text-align:right;margin-left:auto}
.hero .d b{display:block;font-family:var(--font-display);font-size:34px;font-weight:600;color:var(--gold);line-height:1}
.hero .d span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
.kpi{border-radius:12px;padding:16px 18px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.kpi span{display:block;font-family:var(--font-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-display);font-size:44px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.in{background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);color:#fff;border-color:var(--green)}
.kpi.in span,.kpi.in em{color:#cfe5c8}.kpi.in b{color:#fff}
.kpi.out{background:linear-gradient(135deg,#ffc83a 0%,var(--gold) 100%);color:var(--on-gold);border-color:var(--gold)}
.kpi.out span,.kpi.out em{color:#5a4100}
.kpi.od b{color:var(--bad)}
.kpi.od.zero b{color:var(--ok)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.ttile{background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--green-3);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.ttile:hover{border-color:var(--gold-2);border-left-color:var(--gold)}
.ttile.zero{opacity:.55;border-left-color:var(--line)}
.ttile .n{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ttile .l{font-size:12px;font-weight:500;line-height:1.25;min-height:30px}
.ttile .s{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.ttile .s i{font-style:normal}
.ttile .bar{height:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.alist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.alist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.alist li:first-child{border-top:0}
.alist li:hover{background:var(--surface-2)}
.alist .m{flex:1;min-width:0}.alist .m b{display:block;font-weight:500;font-size:13px}.alist .m span{font-size:12px;color:var(--muted)}
.alist .r{font-size:12px;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-3)}
.seg{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0}
.seg i{display:block;height:100%}
.segleg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
.segleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.segleg b{color:var(--fg);font-variant-numeric:tabular-nums}
.pipe-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sbars{display:flex;flex-direction:column;gap:10px}
.sbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 34px;gap:10px;align-items:center;font-size:12px}
.sbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .b{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.sbar .b i{display:block;height:100%}
.sbar .b .a{background:var(--in-c)}.sbar .b .c{background:var(--out-c)}
.sbar .v{font-family:var(--font-display);font-size:16px;text-align:right}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:12.5px}
.tab:hover{border-color:var(--gold-2)}
.tab[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);font-weight:500}
.tab.g[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:12.5px}
th{background:var(--green);color:#fff;text-align:left;padding:9px 10px;font-family:var(--font-display);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:12px;white-space:nowrap;border-bottom:3px solid var(--gold)}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td.stripe{border-left:5px solid var(--c)}
tbody tr:hover{background:var(--surface-2)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.dir{font-weight:600;white-space:nowrap}.dir.in{color:var(--in-c)}.dir.out{color:var(--out-c)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--green);color:#fff;border-left:5px solid var(--gold);padding:10px 14px;border-radius:8px;z-index:9;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:repeating-linear-gradient(135deg,rgba(253,181,21,.10) 0 16px,transparent 16px 44px),radial-gradient(100% 120% at 20% 0%,#0c5a14 0%,var(--green) 55%,#021500 100%)}
.login form{background:var(--surface);border-radius:14px;padding:84px 28px 26px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;position:relative;border-bottom:5px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.45);margin-top:70px}
.login form>img{position:absolute;left:50%;top:-70px;width:150px;height:150px;transform:translateX(-50%);border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.login h2{font-family:var(--font-display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);font-weight:600}
:root[data-theme="dark"] .login h2{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login h2{color:var(--gold)}}
.login label{text-align:left}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.rep-head{text-align:center;margin:10px 0 14px}
.rep-head img{width:70px;height:70px}
.rep-head b{display:block;font-family:var(--font-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.rep-sec{margin-top:18px;break-inside:avoid-page}
.rep-sec h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px;padding:8px 12px;border-left:6px solid var(--gold);background:var(--surface-2);color:var(--fg);border-radius:0 6px 6px 0;font-size:15px}
.rep-sec h3 small{color:var(--muted);font-weight:400;font-family:var(--font-body);letter-spacing:0;text-transform:none;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px;justify-content:center}
.chips span{background:var(--gold-bg);color:var(--warn);padding:2px 10px;border-radius:99px;font-weight:500}
@media (max-width:980px){.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:3px solid var(--gold)}
  .brand{flex-direction:row;text-align:left}.brand img{width:56px;height:56px}
  nav{flex-direction:row;flex-wrap:wrap}
  nav h4{width:100%;margin-top:6px}
  .side-foot{margin-top:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:1fr}
  .hero .d{margin-left:0;text-align:left}
  .hero img{width:84px;height:84px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
@media print{aside,.top,.noprint,.toast{display:none!important}.app{display:block}body{background:#fff;color:#000}.panel{border:0;padding:0}th{background:#e8e8e8!important;color:#000!important;border-bottom:2px solid #000}.pill{border:1px solid #999;background:#fff!important;color:#000!important}.tw{overflow:visible;border:0}table{min-width:0;font-size:10.5px}tr{break-inside:avoid}.rep-sec h3{background:#f3f3f3!important;color:#000}.rep-head b{color:#000}}
</style>

var S={settings:null,records:[],users:[],audit:[]};
var session=null,token=null,view="dashboard",editId=null,entryDir="Incoming",toastT=null;
var y=new Date().getFullYear();
var df={from:y+"-01-01",to:y+"-12-31",dir:""};
function newRf(dir){return {dir:dir||"",group:"",q:"",docType:"",status:"",overdue:false};}
var rf=newRf();
var rp={from:y+"-01-01",to:y+"-12-31",dir:"",docType:"",status:"",groupBy:"docType"};
var $=function(s,r){return (r||document).querySelector(s);};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(d){if(!d)return "";var p=String(d).split("-");return p.length===3?p[1]+"/"+p[2]+"/"+p[0]:d;}
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i;});}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function logoSrc(){return (S.settings&&S.settings.logo)||LOGO;}
function toast(m){var o=$(".toast");if(o)o.remove();var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(function(){e.remove();},3500);}
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
      var m=(e&&e.message)||String(e);m=m.replace(/^Error:\s*/,"");
      if(m.indexOf("SESSION_EXPIRED")>=0){session=null;token=null;try{sessionStorage.removeItem("dts.t");}catch(x){}loginScreen("Your session expired. Log in again.");rej(new Error("expired"));return;}
      rej(new Error(m));
    })[fn].apply(null,args);
  });
}
function authed(fn){return api.apply(null,[fn,token].concat([].slice.call(arguments,1)));}
function fail(e){if(e.message!=="expired")toast(e.message);}
function busy(btn,on){if(!btn)return;btn.disabled=on;btn.dataset.l=btn.dataset.l||btn.textContent;btn.textContent=on?"Working…":btn.dataset.l;}
function opts(list,sel,ph){return (ph!==undefined?'<option value="">'+esc(ph)+'</option>':'')+list.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>';}).join("");}

/* ---- status helpers ---- */
function statusList(dir){return dir==="Outgoing"?S.settings.outStatuses:S.settings.inStatuses;}
function isBad(s){return /cancel|return|reject/i.test(s);}
function finalOf(dir){var l=statusList(dir).filter(function(s){return !isBad(s);});return l[l.length-1];}
function isDone(r){return r.status===finalOf(r.direction);}
function isOpen(r){return !isDone(r)&&!isBad(r.status);}
function isOverdue(r){return !!r.dueDate&&r.dueDate<today()&&isOpen(r);}
function statusPill(s,dir){var l=statusList(dir).filter(function(x){return !isBad(x);});var c=isBad(s)?"p-bad":(s===l[l.length-1]?"p-ok":(s===l[0]?"p-warn":"p-info"));return '<span class="pill '+c+'">'+esc(s)+'</span>';}
function dirTag(d){return d==="Outgoing"?'<span class="dir out">&uarr; Outgoing</span>':'<span class="dir in">&darr; Incoming</span>';}
function stripeVar(r){return "--c:"+(r.direction==="Outgoing"?"var(--out-c)":"var(--in-c)");}

function stacked(a,b){
  var mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var W=480,H=200,L=28,B=26,T=14,tot=a.map(function(v,i){return v+b[i];}),mx=Math.max(1,Math.max.apply(null,tot));var step=mx<=5?1:Math.ceil(mx/5);mx=Math.ceil(mx/step)*step;
  var bw=(W-L-8)/12,g="",ph=H-T-B;
  for(var v=0;v<=mx;v+=step){var yy=T+ph*(1-v/mx);g+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v+'</text>';}
  for(var i=0;i<12;i++){var x=L+i*bw+bw*.18,w=bw*.64,ha=ph*a[i]/mx,hb=ph*b[i]/mx;
    if(a[i])g+='<rect x="'+x+'" y="'+(H-B-ha)+'" width="'+w+'" height="'+ha+'" fill="var(--in-c)"/>';
    if(b[i])g+='<rect x="'+x+'" y="'+(H-B-ha-hb)+'" width="'+w+'" height="'+hb+'" fill="var(--out-c)"/>';
    if(tot[i])g+='<text x="'+(x+w/2)+'" y="'+(H-B-ha-hb-4)+'" text-anchor="middle" font-size="10" fill="var(--fg)">'+tot[i]+'</text>';
    g+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+mn[i]+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly volume of incoming and outgoing documents">'+g+'</svg>';
}

    var rs=S.records.filter(function(r){return (!rf.dir||r.direction===rf.dir)&&(!rf.group||r.partyGroup===rf.group)&&(!rf.docType||r.docType===rf.docType)&&(!rf.status||r.status===rf.status)&&(!rf.overdue||isOverdue(r))&&(!q||[r.code,r.subject,r.party,r.refNo,r.personnel,r.docType].join(" ").toLowerCase().indexOf(q)>=0);});
    $("#rt").innerHTML=rs.length?'<div class="tw"><table><thead><tr><th>Actions</th><th>Code</th><th>Direction</th><th>Date</th><th>Document Type</th><th>Subject</th><th>From / To</th><th>Status</th><th>Due</th></tr></thead><tbody>'+rs.map(function(r){return '<tr><td class="stripe" style="white-space:nowrap;'+stripeVar(r)+'"><button class="btn sm" data-e="'+esc(r.id)+'">Edit</button>'+(isAdmin?' <button class="btn sm danger" data-d="'+esc(r.id)+'">Delete</button>':'')+'</td><td class="mono">'+esc(r.code)+'</td><td>'+dirTag(r.direction)+'</td><td class="mono">'+fmt(r.received)+'</td><td>'+esc(r.docType)+'</td><td>'+esc(r.subject)+(r.refNo?'<br><span class="note mono">'+esc(r.refNo)+'</span>':'')+(r.fileUrl?'<br><a class="note" href="'+esc(r.fileUrl)+'" target="_blank" rel="noopener">'+esc(r.fileName||"Open file")+'</a>':'')+'</td><td>'+esc(r.party)+(r.partyGroup?'<br><span class="note">'+esc(r.partyGroup)+'</span>':'')+'</td><td>'+statusPill(r.status,r.direction)+'</td><td class="mono">'+(isOverdue(r)?'<span class="pill p-bad">'+fmt(r.dueDate)+'</span>':fmt(r.dueDate))+'</td></tr>';}).join("")+'</tbody></table></div>':'<div class="empty">No documents match. Add one with New Incoming or New Outgoing.</div>';
    $("#rt").querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){var r=S.records.filter(function(x){return x.id===b.dataset.e;})[0];editId=r.id;entryDir=r.direction;view="entry";shell();};});
    $("#rt").querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Confirm";return;}busy(b,true);authed("deleteRecord",b.dataset.d).then(function(){S.records=S.records.filter(function(x){return x.id!==b.dataset.d;});toast("Record deleted.");draw();}).catch(function(e){busy(b,false);fail(e);});};});
  };
  ["q","ft","fs","fo"].forEach(function(id){$("#"+id).oninput=draw;});draw();
}

/* ---------- Reports ---------- */
var GROUPS={docType:["Document Type",function(r){return r.docType||"(none)";}],partyGroup:["Office Group",function(r){return r.partyGroup||"(no group)";}],month:["Month",function(r){return (r.received||"").slice(0,7);}],none:["No grouping",function(){return "All documents";}]};
function reportsV(p){
  var s=S.settings;
  p.innerHTML='<div class="panel"><div class="row noprint"><label>From<input type="date" id="rf" value="'+esc(rp.from)+'"></label><label>To<input type="date" id="rt2" value="'+esc(rp.to)+'"></label><label>Direction<select id="rd2"><option value="">Incoming and Outgoing</option><option value="Incoming"'+(rp.dir==="Incoming"?" selected":"")+'>Incoming</option><option value="Outgoing"'+(rp.dir==="Outgoing"?" selected":"")+'>Outgoing</option></select></label><label>Document type<select id="rtp">'+opts(s.docTypes,rp.docType,"All Types")+'</select></label><label>Status<select id="rst">'+opts(uniq(s.inStatuses.concat(s.outStatuses)),rp.status,"All Status")+'</select></label><label>Group by<select id="rgb">'+Object.keys(GROUPS).map(function(k){return '<option value="'+k+'"'+(rp.groupBy===k?" selected":"")+'>'+GROUPS[k][0]+'</option>';}).join("")+'</select></label></div><div class="row noprint" style="margin-top:10px"><button class="btn gold" id="rg">Generate Report</button><button class="btn ok" id="rpr">Print Report</button><button class="btn" id="rdl">Download Sheet Report</button></div><div id="rb"></div></div>';
  var read=function(){rp={from:$("#rf").value,to:$("#rt2").value,dir:$("#rd2").value,docType:$("#rtp").value,status:$("#rst").value,groupBy:$("#rgb").value};};
  var rows=function(){read();return S.records.filter(function(r){return inRange(r,rp.from,rp.to)&&(!rp.dir||r.direction===rp.dir)&&(!rp.docType||r.docType===rp.docType)&&(!rp.status||r.status===rp.status);}).sort(function(a,b){return a.received<b.received?-1:1;});};
  var draw=function(){var rs=rows();var key=GROUPS[rp.groupBy][1];
    var order=[];rs.forEach(function(r){var k=key(r);if(order.indexOf(k)<0)order.push(k);});
    if(rp.groupBy==="docType")order.sort(function(a,b){var i=s.docTypes.indexOf(a),j=s.docTypes.indexOf(b);return (i<0?99:i)-(j<0?99:j);});else order.sort();
    var sections=order.map(function(k){var m=rs.filter(function(r){return key(r)===k;});
      return '<div class="rep-sec"><h3><span>'+esc(k)+'</span><small>'+m.length+' document'+(m.length===1?"":"s")+'</small></h3><div class="tw"><table style="min-width:760px"><thead><tr><th>Code</th><th>Date</th><th>Dir.</th>'+(rp.groupBy==="docType"?"":"<th>Document Type</th>")+'<th>Subject</th><th>From / To</th><th>Reference No.</th><th>Status</th></tr></thead><tbody>'+m.map(function(r){return '<tr><td class="mono">'+esc(r.code)+'</td><td class="mono">'+fmt(r.received)+'</td><td>'+(r.direction==="Outgoing"?"Out":"In")+'</td>'+(rp.groupBy==="docType"?"":'<td>'+esc(r.docType)+'</td>')+'<td>'+esc(r.subject)+'</td><td>'+esc(r.party)+'</td><td class="mono">'+esc(r.refNo)+'</td><td>'+statusPill(r.status,r.direction)+'</td></tr>';}).join("")+'</tbody></table></div></div>';}).join("");
    var nIn=rs.filter(function(r){return r.direction==="Incoming";}).length;
    $("#rb").innerHTML='<div class="rep-head"><img alt="" src="'+esc(logoSrc())+'"><span class="note" style="display:block">'+esc(s.orgName)+(s.office?' &middot; '+esc(s.office):'')+'</span><b>'+esc(s.reportTitle)+(rp.dir?' ('+esc(rp.dir)+')':'')+'</b>'+(s.reportSub?'<span class="note">'+esc(s.reportSub)+'</span><br>':'')+'<span class="note">Period: '+fmt(rp.from)+' to '+fmt(rp.to)+'</span></div><div class="chips"><span>Total: '+rs.length+'</span><span>Incoming: '+nIn+'</span><span>Outgoing: '+(rs.length-nIn)+'</span><span>Completed: '+rs.filter(isDone).length+'</span><span>Open: '+rs.filter(isOpen).length+'</span></div>'+(sections||'<div class="empty">No documents match these filters.</div>');};
  $("#rg").onclick=draw;
  $("#rpr").onclick=function(){draw();window.print();};
  $("#rdl").onclick=function(){var b=this;read();busy(b,true);authed("createReportSheet",{from:rp.from,to:rp.to,direction:rp.dir,docType:rp.docType,status:rp.status,groupBy:rp.groupBy}).then(function(url){busy(b,false);$("#rb").insertAdjacentHTML("afterbegin",'<div class="banner noprint" style="background:var(--ok-bg);color:var(--ok)">Report sheet created. <a href="'+esc(url)+'" target="_blank" rel="noopener">Open in Google Sheets</a></div>');}).catch(function(e){busy(b,false);fail(e);});};
  draw();
}

/* ---------- Users ---------- */
function usersV(p){
  p.innerHTML='<form class="panel" id="uf"><h3>Create user</h3><div class="row"><label>Username<input id="un" required></label><label>Full name<input id="ufn" required></label><label>Password (8+ characters)<input id="up" type="password" required minlength="8" autocomplete="new-password"></label><label>Role<select id="ur"><option>Encoder</option><option>Admin</option></select></label><button class="btn gold" type="submit">Create User</button></div></form><div class="panel" style="margin-top:14px"><div class="tw"><table style="min-width:620px"><thead><tr><th>Username</th><th>Full name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+S.users.map(function(u){return '<tr><td class="mono">'+esc(u.username)+'</td><td>'+esc(u.fullName)+'</td><td>'+esc(u.role)+'</td><td>'+(u.active?'<span class="pill p-ok">Active</span>':'<span class="pill p-bad">Inactive</span>')+'</td><td style="white-space:nowrap"><button class="btn sm" data-t="'+esc(u.username)+'">'+(u.active?"Deactivate":"Activate")+'</button> <button class="btn sm" data-p="'+esc(u.username)+'">Reset Password</button></td></tr>';}).join("")+'</tbody></table></div><div class="note" id="pn" style="margin-top:8px"></div></div>';
  $("#uf").onsubmit=function(e){e.preventDefault();var b=$("#uf button");busy(b,true);authed("createUser",$("#un").value,$("#ufn").value,$("#ur").value,$("#up").value).then(function(){toast("User created.");shell();}).catch(function(err){busy(b,false);fail(err);});};
  p.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){authed("toggleUser",b.dataset.t).then(function(){shell();}).catch(fail);};});
  p.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){authed("resetPassword",b.dataset.p).then(function(pw){$("#pn").textContent="New temporary password for "+b.dataset.p+": "+pw+". Share it privately; it is not shown again.";}).catch(fail);};});
}

/* ---------- Audit ---------- */
function auditV(p){
  p.innerHTML='<div class="panel"><div class="tw"><table style="min-width:720px"><thead><tr><th>Date / Time</th><th>Username</th><th>Name</th><th>Action</th><th>Document</th><th>Details</th></tr></thead><tbody>'+S.audit.map(function(a){return '<tr><td class="mono">'+esc(new Date(a.time).toLocaleString())+'</td><td class="mono">'+esc(a.username)+'</td><td>'+esc(a.fullName)+'</td><td><span class="pill p-info">'+esc(String(a.action).toLowerCase())+'</span></td><td class="mono">'+esc(a.doc)+'</td><td>'+esc(a.details)+'</td></tr>';}).join("")+'</tbody></table></div></div>';
}

/* ---------- Settings ---------- */
function settingsV(p){
  var s=S.settings;
  var f=function(id,l,v,t,ph){return '<label>'+l+'<input id="s_'+id+'" type="'+(t||"text")+'" value="'+esc(v)+'" placeholder="'+esc(ph||"")+'"></label>';};
  var ta=function(id,l,arr,h){return '<label>'+l+'<textarea id="s_'+id+'" rows="6">'+esc(arr.join("\n"))+'</textarea><span class="note">'+(h||"One per line.")+'</span></label>';};
  p.innerHTML='<form class="panel" id="sf"><p class="note" style="margin-top:0">Admin can customize this system without editing the source code.</p><h3>Organization &amp; branding</h3><div class="grid">'+f("systemName","System Name",s.systemName)+f("orgName","Organization Name",s.orgName)+f("office","Office / Cluster",s.office)+f("address","Address",s.address)+f("reportTitle","Report Title",s.reportTitle)+f("reportSub","Report Subtitle",s.reportSub)+'<div class="full">'+f("logo","Logo URL (optional)",s.logo,"text","Leave blank to use the Peace and Security Cluster seal")+'</div></div>'+
   '<h3 style="margin-top:20px">Storage &amp; document codes</h3><div class="grid">'+f("driveId","Google Drive Folder ID",s.driveId)+f("maxMb","Maximum Upload Size (MB)",s.maxMb,"number")+f("prefixIn","Incoming Code Prefix",s.prefixIn,"text","Example: IN")+f("prefixOut","Outgoing Code Prefix",s.prefixOut,"text","Example: OUT")+'<span class="note full">Codes look like IN-2026-10-001 and OUT-2026-10-001. Leave a prefix blank to turn codes off for that direction. Paste only the folder ID from the Drive folder link.</span></div>'+
   '<h3 style="margin-top:20px">Dropdown lists</h3><div class="grid">'+ta("docTypes","Document types",s.docTypes)+ta("partyGroups","Office groups",s.partyGroups)+ta("parties","From / To suggestions",s.parties,"One per line. People can still type any name.")+ta("modes","Modes of delivery",s.modes)+ta("inStatuses","Incoming statuses",s.inStatuses,"In order. The last one counts as completed. Names with Cancel, Return or Reject count as closed.")+ta("outStatuses","Outgoing statuses",s.outStatuses,"In order. The last one counts as completed.")+'</div><div class="row" style="margin-top:16px"><button class="btn gold" type="submit">Save Settings</button></div></form>';
  $("#sf").onsubmit=function(e){e.preventDefault();var b=$("#sf button");busy(b,true);var g=function(k){return $("#s_"+k).value.trim();},L=function(k){return $("#s_"+k).value.split("\n").map(function(x){return x.trim();}).filter(Boolean);};
    var n={systemName:g("systemName"),orgName:g("orgName"),office:g("office"),address:g("address"),reportTitle:g("reportTitle"),reportSub:g("reportSub"),logo:g("logo"),driveId:g("driveId"),prefixIn:g("prefixIn"),prefixOut:g("prefixOut"),maxMb:g("maxMb"),docTypes:L("docTypes"),partyGroups:L("partyGroups"),parties:L("parties"),modes:L("modes"),inStatuses:L("inStatuses"),outStatuses:L("outStatuses")};
    authed("saveSettings",n).then(function(c){S.settings=c;toast("Settings saved.");shell();}).catch(function(err){busy(b,false);fail(err);});};
}

/* ---------- Boot ---------- */
var saved=null;try{saved=sessionStorage.getItem("dts.t");}catch(x){}
if(saved){token=saved;api("whoami",token).then(function(r){session=r.user;S.settings=r.settings;shell();}).catch(function(){token=null;loginScreen();});}
else loginScreen();
})();
</script>
